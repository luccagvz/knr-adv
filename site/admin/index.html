<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Notícias — KNR Admin</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <header class="admin-topbar">
      <div class="admin-topbar__brand">
        <img src="/img/logo-knr.png" alt="" style="height:24px">
        KNR Admin
      </div>
      <div class="admin-topbar__user">
        <span id="user-email"></span>
        <button id="logout-btn" type="button">Sair</button>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-page-header">
        <div>
          <h1>Notícias</h1>
          <p>Crie, edite e publique as notícias do site institucional.</p>
        </div>
        <a class="btn-admin btn-admin--primary" href="/admin/editor.html">+ Nova notícia</a>
      </div>

      <div class="admin-filters" id="filters">
        <button class="admin-filter is-active" data-filter="todos">Todos</button>
        <button class="admin-filter" data-filter="published">Publicados</button>
        <button class="admin-filter" data-filter="draft">Rascunhos</button>
      </div>

      <div id="alert-box"></div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Título</th>
              <th>Categoria</th>
              <th>Data</th>
              <th>Última atualização</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="news-tbody">
            <tr><td colspan="6" class="admin-empty">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
  <script src="/admin/js/env.js"></script>
  <script src="/admin/js/supabaseClient.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/admin/js/dashboard.js"></script>
</body>
</html>
