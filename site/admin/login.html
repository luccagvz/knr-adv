<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Login — KNR Admin</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="admin-login">
    <div class="admin-login__card">
      <img class="admin-login__logo" src="/img/logo-knr.png" alt="KNR Advogados">
      <h1>KNR Admin</h1>
      <p class="subtitle">Painel de notícias — acesso restrito</p>

      <div id="alert-box"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-admin btn-admin--primary" id="submit-btn" style="width:100%;justify-content:center">
          Entrar
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/admin/js/env.js"></script>
  <script src="/admin/js/supabaseClient.js"></script>
  <script>
    const alertBox = document.getElementById('alert-box');
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    function showAlert(message, type) {
      alertBox.innerHTML = `<div class="form-alert form-alert--${type}">${message}</div>`;
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('erro') === 'sem-permissao') {
      showAlert('Login OK, mas esse e-mail não tem permissão de administrador. Fale com quem gerencia o Supabase do escritório.', 'error');
    }

    (async () => {
      try {
        const sb = getSupabase();
        const { data: { session } } = await sb.auth.getSession();
        if (session) window.location.href = '/admin/';
      } catch (err) {
        showAlert(err.message, 'error');
        form.querySelectorAll('input, button').forEach((el) => (el.disabled = true));
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span> Entrando...';
      alertBox.innerHTML = '';

      try {
        const sb = getSupabase();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = '/admin/';
      } catch (err) {
        showAlert(err.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
