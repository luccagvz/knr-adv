<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Login — KNR Admin</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>
  <div class="admin-login">
    <div class="admin-login__card">
      <img class="admin-login__logo" src="/img/logo-knr.png" alt="KNR Advogados">
      <h1>KNR Admin</h1>
      <p class="subtitle">Painel de notícias — acesso restrito</p>

      <div id="alert-box"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-admin btn-admin--primary" id="submit-btn" style="width:100%;justify-content:center">
          Entrar
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
  <script src="/admin/js/env.js"></script>
  <script src="/admin/js/supabaseClient.js"></script>
  <script src="/admin/js/loginPage.js"></script>
</body>
</html>
